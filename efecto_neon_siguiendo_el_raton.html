<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Efecto neón siguiendo el ratón</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050510;
      font-family: Arial, Helvetica, sans-serif;
      cursor: crosshair;
    }
    body {
      background:
        radial-gradient(ellipse at 50% 45%, rgba(22, 18, 65, .48), transparent 58%),
        linear-gradient(135deg, #050510, #09051b 55%, #030711);
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .content {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      text-align: center;
      pointer-events: none;
      padding: 24px;
    }
    h1 {
      margin: 0;
      color: #e9ffff;
      font-size: clamp(2.2rem, 7vw, 5.5rem);
      letter-spacing: .12em;
      text-shadow: 0 0 8px #00f7ff, 0 0 22px #00cfff,
                   0 0 48px #7b2cff, 0 0 85px #7b2cff;
    }
    p {
      margin: 18px 0 0;
      color: #c7c8ff;
      font-size: clamp(.9rem, 2vw, 1.15rem);
      letter-spacing: .08em;
      text-shadow: 0 0 12px #8d65ff;
    }
    .hint {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(220, 225, 255, .68);
      font-size: .8rem;
      letter-spacing: .08em;
      text-align: center;
      width: 90%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <main class="content">
    <h1>EFECTO NEÓN</h1>
    <p>EL BRILLO SIGUE EL MOVIMIENTO DEL RATÓN</p>
  </main>
  <div class="hint">Mueve el ratón por la pantalla · Haz clic para crear una explosión de luz</div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let width = window.innerWidth;
    let height = window.innerHeight;
    let particles = [];
    let hue = 185;

    const mouse = { x: width / 2, y: height / 2, active: false, lastX: 0, lastY: 0 };

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function addParticle(x, y, amount = 3, burst = false) {
      for (let i = 0; i < amount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = burst ? Math.random() * 7 + 1 : Math.random() * 2.8 + .4;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: burst ? Math.random() * 4 + 1.5 : Math.random() * 3 + 1,
          life: 1,
          decay: burst ? Math.random() * .012 + .009 : Math.random() * .018 + .012,
          hue: (hue + Math.random() * 75 - 25 + 360) % 360
        });
      }
    }

    window.addEventListener("pointermove", (event) => {
      mouse.x = event.clientX;
      mouse.y = event.clientY;
      mouse.active = true;

      const dx = mouse.x - mouse.lastX;
      const dy = mouse.y - mouse.lastY;
      const distance = Math.hypot(dx, dy);
      const count = Math.min(12, Math.max(2, Math.floor(distance / 5)));

      for (let i = 0; i < count; i++) {
        const t = count === 1 ? 1 : i / count;
        addParticle(
          mouse.lastX + dx * t,
          mouse.lastY + dy * t,
          2
        );
      }

      mouse.lastX = mouse.x;
      mouse.lastY = mouse.y;
      hue = (hue + 1.2) % 360;
    });

    window.addEventListener("pointerdown", (event) => {
      mouse.x = event.clientX;
      mouse.y = event.clientY;
      mouse.active = true;
      addParticle(mouse.x, mouse.y, 75, true);
    });

    function draw() {
      // Un velo semitransparente crea una estela suave.
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "rgba(5, 5, 16, 0.18)";
      ctx.fillRect(0, 0, width, height);

      ctx.globalCompositeOperation = "lighter";

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= .985;
        p.vy *= .985;
        p.life -= p.decay;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius * p.life, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${p.hue}, 100%, 65%, ${p.life})`;
        ctx.shadowBlur = 18;
        ctx.shadowColor = `hsla(${p.hue}, 100%, 60%, ${p.life})`;
        ctx.fill();
      }

      if (mouse.active) {
        // Halo exterior.
        const glow = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 34);
        glow.addColorStop(0, "rgba(255,255,255,.95)");
        glow.addColorStop(.12, "rgba(80,255,255,.8)");
        glow.addColorStop(.4, "rgba(0,190,255,.22)");
        glow.addColorStop(1, "rgba(0,190,255,0)");
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, 34, 0, Math.PI * 2);
        ctx.fillStyle = glow;
        ctx.fill();

        // Núcleo brillante.
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.shadowBlur = 24;
        ctx.shadowColor = "#00ffff";
        ctx.fill();
      }

      ctx.shadowBlur = 0;
      requestAnimationFrame(draw);
    }

    // Fondo limpio al iniciar.
    ctx.fillStyle = "#050510";
    ctx.fillRect(0, 0, width, height);
    draw();
  </script>
</body>
</html>
